name: Bug Report
description: File a bug report
body:
  - type: markdown
    attributes:
      value: |
        #### Before You Start

        Make sure to look through [the docs](https://xl-docs.codepoems.eu) first.
        
  - type: input
    id: version
    attributes:
      label: Version
      description: The version of XL Converter used. You will find it in the About tab.
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      description: The operating system where the issue occurred.
      options:
        - Windows
        - Linux
      default: 0
    validations:
      required: true
  
  - type: textarea
    id: bug-description
    attributes:
      label: Description
      description: Provide a clear and concise description of the bug.
    validations:
      required: true
    
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Write a step-by-step instruction on how to reproduce the issue.
    validations:
      required: true
    
  - type: textarea
    id: expected
    attributes:
      label: Expected Result
      description: Describe what should happen.
    validations:
      required: true
    
  - type: textarea
    id: what-happened
    attributes:
      label: Current Result
      description: Describe what happened instead.
    validations:
      required: true
    
  - type: input
    id: input-formats
    attributes:
      label: Input Formats
      description: What image formats are you converting from? They are listed in the Input tab.
      placeholder: PNG, JPEG
    validations:
      required: false
    
  - type: input
    id: output-format
    attributes:
      label: Selected Format / Mode
      description: The selected "Format / Mode" option, found in the Output tab.
      placeholder: JPEG XL, Lossless JPEG Transcoding etc.
    validations:
      required: false
    
  - type: textarea
    id: additional-info
    attributes:
      label: Additional Information (Optional)
      description: Include any other relevant information, such as error messages, or screenshots.
    validations:
      required: false
